<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Din portefølje. NordInvest ejendomsanalyser.</title>
<meta name="application-name" content="NordInvest">
<meta name="apple-mobile-web-app-title" content="NordInvest">
<meta name="description" content="Dine gemte boliganalyser — alle de nordiske og europæiske investeringer, du har kørt gennem NordInvest, samlet ét sted.">
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#0F1F3D">
<link rel="canonical" href="https://www.nordinvest.io/portfolio">
<link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --navy: #0F1F3D;
    --navy-light: #1a3360;
    --blue: #2563EB;
    --blue-light: #3B82F6;
    --blue-pale: #EFF6FF;
    --green: #10B981;
    --green-pale: #ECFDF5;
    --amber: #F59E0B;
    --amber-pale: #FFFBEB;
    --red: #EF4444;
    --red-pale: #FEF2F2;
    --grey-50: #F8F9FA;
    --grey-100: #F1F5F9;
    --grey-200: #E2E8F0;
    --text: #111827;
    --text-muted: #6B7280;
    --border: #E5E7EB;
  }
  body {
    overflow-x: hidden; max-width: 100vw;
    font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    color: var(--text);
    background: var(--grey-50);
    line-height: 1.6;
    min-height: 100vh;
  }
  .mono {
    font-family: 'JetBrains Mono', monospace;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
  }

  /* Top nav */
  .nav {
    background: rgba(255,255,255,0.95);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 50;
  }
  .nav-inner {
    max-width: 1100px; margin: 0 auto;
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 24px;
  }
  .nav a.logo {
    color: var(--navy); text-decoration: none;
    font-weight: 800; font-size: 18px;
    letter-spacing: -0.4px;
  }
  .nav-links { display: flex; gap: 20px; align-items: center; }
  .nav-links a {
    color: var(--text-muted); text-decoration: none;
    font-size: 14px; font-weight: 500;
    transition: color 180ms ease;
  }
  .nav-links a:hover { color: var(--navy); }
  .nav-cta {
    background: var(--navy);
    color: #fff !important;
    padding: 8px 16px;
    border-radius: 8px;
    font-weight: 600 !important;
    font-size: 13.5px !important;
  }
  .nav-cta:hover { background: var(--navy-light); }

  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 36px 24px 100px;
  }

  /* ═══════════ HERO PROFILE CARD ═══════════ */
  .profile-hero {
    background: linear-gradient(135deg, #0F1F3D 0%, #1a3360 60%, #2563EB 130%);
    border-radius: 22px;
    padding: 36px 40px;
    color: #fff;
    box-shadow:
      0 1px 2px rgba(15,31,61,0.06),
      0 30px 60px rgba(15,31,61,0.15);
    position: relative;
    overflow: hidden;
    margin-bottom: 28px;
  }
  .profile-hero::before {
    content: '';
    position: absolute;
    top: -30%; right: -10%;
    width: 380px; height: 380px;
    background: radial-gradient(circle, rgba(96,165,250,0.35) 0%, rgba(37,99,235,0) 70%);
    pointer-events: none;
  }
  .profile-hero::after {
    content: '';
    position: absolute;
    bottom: -50%; left: -10%;
    width: 360px; height: 360px;
    background: radial-gradient(circle, rgba(16,185,129,0.18) 0%, rgba(16,185,129,0) 70%);
    pointer-events: none;
  }
  .profile-hero-inner {
    position: relative;
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: 28px;
  }
  .avatar-xl {
    width: 84px; height: 84px;
    border-radius: 22px;
    background: linear-gradient(135deg, #2563EB 0%, #60a5fa 100%);
    display: flex; align-items: center; justify-content: center;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 30px;
    color: #fff;
    letter-spacing: -1px;
    border: 3px solid rgba(255,255,255,0.18);
    box-shadow: 0 12px 32px rgba(37,99,235,0.35);
    flex-shrink: 0;
  }
  .profile-info-name {
    font-size: 28px;
    font-weight: 700;
    color: #fff;
    letter-spacing: -0.6px;
    line-height: 1.15;
    margin-bottom: 6px;
  }
  .profile-info-meta {
    font-size: 14px;
    color: rgba(255,255,255,0.7);
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    align-items: center;
  }
  .profile-info-meta span {
    display: inline-flex; align-items: center; gap: 6px;
  }
  .profile-info-meta svg {
    width: 13px; height: 13px;
    opacity: 0.7;
  }
  .profile-actions { display: flex; gap: 10px; flex-shrink: 0; }
  .profile-btn-ghost {
    display: inline-flex; align-items: center; gap: 7px;
    background: rgba(255,255,255,0.1);
    color: #fff;
    text-decoration: none;
    padding: 10px 16px;
    border-radius: 9px;
    font-size: 13.5px;
    font-weight: 500;
    border: 1px solid rgba(255,255,255,0.18);
    transition: all 200ms ease;
    cursor: pointer;
    font-family: inherit;
  }
  .profile-btn-ghost:hover {
    background: rgba(255,255,255,0.18);
  }
  .profile-btn-primary {
    display: inline-flex; align-items: center; gap: 7px;
    background: #fff;
    color: var(--navy);
    text-decoration: none;
    padding: 10px 18px;
    border-radius: 9px;
    font-size: 13.5px;
    font-weight: 600;
    transition: all 200ms ease;
  }
  .profile-btn-primary:hover {
    transform: translateY(-1px);
    box-shadow: 0 10px 24px rgba(0,0,0,0.18);
  }

  /* ═══════════ STATS STRIP ═══════════ */
  .stats-strip {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 28px;
  }
  .stat-card {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px 20px;
    transition: all 220ms ease;
  }
  .stat-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 30px rgba(15,31,61,0.06);
  }
  .stat-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.4px;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 8px;
  }
  .stat-value {
    font-size: 26px;
    font-weight: 700;
    color: var(--navy);
    letter-spacing: -0.6px;
    line-height: 1;
    font-family: 'JetBrains Mono', monospace;
    font-variant-numeric: tabular-nums;
  }
  .stat-value.positive { color: var(--green); }
  .stat-value.negative { color: var(--red); }
  .stat-sub {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 6px;
  }

  /* ═══════════ SECTION HEADER ═══════════ */
  .section-header {
    display: flex; align-items: baseline;
    justify-content: space-between;
    margin-bottom: 16px;
  }
  .section-title {
    font-size: 19px;
    font-weight: 700;
    color: var(--navy);
    letter-spacing: -0.3px;
  }
  .section-count {
    font-size: 13px;
    color: var(--text-muted);
    font-family: 'JetBrains Mono', monospace;
  }

  /* ═══════════ PROPERTY GRID ═══════════ */
  .property-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 14px;
  }
  .property-card {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 22px;
    position: relative;
    transition: all 240ms cubic-bezier(0.4, 0, 0.2, 1);
    cursor: default;
    overflow: hidden;
  }
  .property-card:hover {
    transform: translateY(-3px);
    border-color: rgba(37,99,235,0.35);
    box-shadow:
      0 1px 2px rgba(15,31,61,0.04),
      0 16px 40px rgba(15,31,61,0.08);
  }
  .property-card::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--blue) 0%, var(--blue-light) 100%);
    opacity: 0;
    transition: opacity 240ms ease;
  }
  .property-card:hover::after { opacity: 1; }

  .pc-top {
    display: flex; align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 14px;
  }
  .pc-location {
    font-size: 15px;
    font-weight: 600;
    color: var(--navy);
    line-height: 1.35;
    flex: 1;
    word-break: break-word;
  }
  .pc-score {
    flex-shrink: 0;
    width: 48px; height: 48px;
    border-radius: 50%;
    background: var(--grey-50);
    border: 2px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 15px;
    color: var(--navy);
    letter-spacing: -0.5px;
    position: relative;
  }
  .pc-score.green { border-color: var(--green); color: var(--green); background: var(--green-pale); }
  .pc-score.amber { border-color: var(--amber); color: var(--amber); background: var(--amber-pale); }
  .pc-score.red   { border-color: var(--red);   color: var(--red);   background: var(--red-pale); }

  .pc-classification {
    display: inline-flex;
    align-items: center; gap: 6px;
    background: var(--blue-pale);
    color: var(--blue);
    padding: 4px 10px;
    border-radius: 99px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.3px;
    margin-bottom: 14px;
  }
  .pc-dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }

  .pc-metrics {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
  }
  .pc-metric { display: flex; flex-direction: column; gap: 3px; }
  .pc-metric-label {
    font-size: 10px;
    font-weight: 600;
    color: var(--text-muted);
    letter-spacing: 0.8px;
    text-transform: uppercase;
  }
  .pc-metric-value {
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    font-weight: 600;
    color: var(--navy);
    letter-spacing: -0.2px;
  }
  .pc-metric-value.positive { color: var(--green); }
  .pc-metric-value.negative { color: var(--red); }

  .pc-footer {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 16px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
  }
  .pc-date {
    font-size: 11px;
    color: var(--text-muted);
    font-family: 'JetBrains Mono', monospace;
  }
  .pc-remove {
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 12px;
    font-family: inherit;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 6px;
    transition: all 180ms ease;
  }
  .pc-remove:hover { background: var(--red-pale); color: var(--red); }

  /* ═══════════ EMPTY / NOT-SIGNED-IN STATES ═══════════ */
  .empty-state {
    text-align: center;
    padding: 80px 24px;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 18px;
  }
  .empty-icon {
    width: 64px; height: 64px;
    margin: 0 auto 18px;
    border-radius: 18px;
    background: linear-gradient(135deg, var(--blue-pale) 0%, #fff 100%);
    display: flex; align-items: center; justify-content: center;
    border: 1px solid var(--border);
  }
  .empty-icon svg { width: 28px; height: 28px; color: var(--blue); }
  .empty-title {
    font-size: 20px;
    font-weight: 700;
    color: var(--navy);
    margin-bottom: 8px;
    letter-spacing: -0.3px;
  }
  .empty-desc {
    font-size: 14px;
    color: var(--text-muted);
    max-width: 380px;
    margin: 0 auto 24px;
    line-height: 1.6;
  }
  .empty-cta {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--navy);
    color: #fff;
    text-decoration: none;
    padding: 12px 22px;
    border-radius: 9px;
    font-weight: 600;
    font-size: 14px;
    transition: all 220ms ease;
  }
  .empty-cta:hover {
    background: var(--navy-light);
    transform: translateY(-2px);
    box-shadow: 0 14px 32px rgba(15,31,61,0.18);
  }

  /* Skeletons */
  .skeleton {
    background: linear-gradient(90deg, var(--grey-50) 25%, var(--grey-100) 50%, var(--grey-50) 75%);
    background-size: 200% 100%;
    animation: shimmer 1.4s linear infinite;
    border-radius: 6px;
  }
  @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

  /* Mobile */
  @media (max-width: 760px) {
    .profile-hero { padding: 28px 22px; border-radius: 18px; }
    .profile-hero-inner {
      grid-template-columns: 1fr;
      gap: 18px; text-align: center;
    }
    .avatar-xl { margin: 0 auto; width: 72px; height: 72px; font-size: 24px; border-radius: 18px; }
    .profile-info-meta { justify-content: center; }
    .profile-actions { justify-content: center; }
    .profile-info-name { font-size: 22px; }
    .stats-strip { grid-template-columns: 1fr 1fr; gap: 10px; }
    .stat-value { font-size: 22px; }
    .property-grid { grid-template-columns: 1fr; }
  }
  @media (max-width: 420px) {
    .stats-strip { grid-template-columns: 1fr; }
    .nav-links a:not(.nav-cta) { display: none; }
  }

  /* ═══════════ INTERACTIVE CARDS ═══════════ */
  .pc-clickable { cursor: pointer; }
  .pc-title { font-size: 15px; font-weight: 700; color: var(--navy); line-height: 1.35; word-break: break-word; }
  .pc-title-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; word-break: break-word; }
  .pc-open-hint { display:inline-flex; align-items:center; gap:4px; font-size: 11px; color: var(--blue); font-weight: 600; margin-top: 10px; }
  .pc-open-hint svg { width: 12px; height: 12px; }
  .pc-rename-input { width: 100%; font-family: inherit; font-size: 15px; font-weight: 700; color: var(--navy); border: 1.5px solid var(--blue); border-radius: 8px; padding: 6px 9px; outline: none; box-shadow: 0 0 0 3px rgba(37,99,235,0.12); }
  .pc-actions { display: flex; gap: 8px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border); }
  .pc-actions .pcbtn { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-family: inherit; font-size: 12.5px; font-weight: 700; padding: 9px 8px; border-radius: 8px; border: 1px solid var(--border); background: #fff; color: var(--navy); cursor: pointer; transition: all 160ms ease; min-height: 40px; }
  .pc-actions .pcbtn svg { width: 14px; height: 14px; flex-shrink: 0; }
  .pc-actions .pcbtn.primary { background: var(--navy); color: #fff; border-color: var(--navy); }
  .pc-actions .pcbtn.primary:hover { background: var(--navy-light); }
  .pc-actions .pcbtn:hover { border-color: var(--blue); color: var(--blue); background: var(--blue-pale); }
  .pc-actions .pcbtn.danger { flex: 0 0 auto; padding: 9px 11px; }
  .pc-actions .pcbtn.danger:hover { border-color: var(--red); color: var(--red); background: var(--red-pale); }
  @media (max-width: 380px) { .pc-actions .pcbtn { font-size: 11.5px; } .pc-actions .pcbtn.label-hide span { display: none; } }

  /* Export-all button in the section header */
  .section-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .btn-export-all { display: inline-flex; align-items: center; gap: 8px; background: var(--navy); color: #fff; border: none; border-radius: 9px; padding: 10px 16px; font-family: inherit; font-size: 13.5px; font-weight: 700; cursor: pointer; transition: all 200ms ease; }
  .btn-export-all:hover { background: var(--navy-light); transform: translateY(-1px); box-shadow: 0 8px 20px rgba(15,31,61,0.16); }
  .btn-export-all svg { width: 15px; height: 15px; }

  /* ═══════════ DETAIL MODAL ═══════════ */
  .pd-backdrop { position: fixed; inset: 0; background: rgba(15,31,61,0.55); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); z-index: 200; display: none; align-items: center; justify-content: center; padding: 20px; }
  .pd-backdrop.open { display: flex; }
  .pd-modal { background: #fff; border-radius: 18px; width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto; box-shadow: 0 30px 70px rgba(15,31,61,0.35); animation: pdin 220ms cubic-bezier(.2,.7,.3,1); }
  @keyframes pdin { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  .pd-head { position: sticky; top: 0; background: var(--navy); color: #fff; padding: 20px 22px; border-radius: 18px 18px 0 0; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; z-index: 1; }
  .pd-head h3 { font-size: 19px; font-weight: 800; letter-spacing: -0.3px; margin: 0; line-height: 1.3; word-break: break-word; }
  .pd-head .pd-loc { font-size: 12.5px; color: rgba(255,255,255,0.68); margin-top: 3px; }
  .pd-close { flex-shrink: 0; background: rgba(255,255,255,0.14); border: none; color: #fff; width: 34px; height: 34px; border-radius: 50%; font-size: 20px; line-height: 1; cursor: pointer; }
  .pd-close:hover { background: rgba(255,255,255,0.28); }
  .pd-body { padding: 22px; }
  .pd-scorewrap { display: flex; align-items: center; gap: 16px; margin-bottom: 8px; }
  .pd-score { flex-shrink: 0; width: 70px; height: 70px; border-radius: 50%; border: 3px solid var(--border); display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: 'JetBrains Mono', monospace; font-weight: 700; }
  .pd-score.green { border-color: var(--green); color: var(--green); background: var(--green-pale); }
  .pd-score.amber { border-color: var(--amber); color: var(--amber); background: var(--amber-pale); }
  .pd-score.red { border-color: var(--red); color: var(--red); background: var(--red-pale); }
  .pd-score b { font-size: 22px; letter-spacing: -1px; } .pd-score span { font-size: 9px; color: var(--text-muted); font-family: inherit; }
  .pd-verdict { flex: 1; min-width: 0; } .pd-verdict .cls { font-size: 15px; font-weight: 800; color: var(--navy); } .pd-verdict .dt { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  .pd-group-title { font-size: 11px; font-weight: 800; letter-spacing: 0.6px; text-transform: uppercase; color: var(--blue); margin: 22px 0 10px; }
  .pd-rows { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .pd-row { background: var(--grey-50); border: 1px solid var(--border); border-radius: 10px; padding: 11px 13px; }
  .pd-row .l { font-size: 10px; font-weight: 700; letter-spacing: 0.4px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 3px; }
  .pd-row .v { font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 700; color: var(--navy); word-break: break-word; }
  .pd-row .v.pos { color: var(--green); } .pd-row .v.neg { color: var(--red); }
  .pd-actions { display: flex; gap: 10px; margin-top: 24px; flex-wrap: wrap; }
  .pd-actions button { flex: 1; min-width: 130px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 12px; border-radius: 10px; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer; border: 1px solid var(--border); background: #fff; color: var(--navy); transition: all 160ms ease; }
  .pd-actions button svg { width: 15px; height: 15px; }
  .pd-actions .primary { background: var(--navy); color: #fff; border-color: var(--navy); }
  .pd-actions .primary:hover { background: var(--navy-light); }
  .pd-actions button:hover { border-color: var(--blue); }
  @media (max-width: 560px) {
    .pd-backdrop { padding: 0; align-items: flex-end; }
    .pd-modal { max-width: 100%; max-height: 94vh; border-radius: 20px 20px 0 0; }
    .pd-head { border-radius: 20px 20px 0 0; }
  }
</style>
<script defer src="/i18n.js"></script>
</head>

<nav class="nav">
  <div class="nav-inner">
    <a href="/" class="logo">NordInvest</a>
    <div class="nav-links">
      <a href="/blog">Blog</a>
      <a href="/investment-models">Strategier</a>
      <a href="/glossary">Ordbog</a>
      <a href="/#analyze-section" class="nav-cta">Analysér en bolig</a>
      <a href="/portfolio" class="nav-profile" id="nav-profile" style="display:none" title="Se din profil" aria-label="Profil"><span class="nav-profile-avatar" id="nav-profile-avatar">?</span></a>
    </div>
  </div>
</nav>

<main id="portfolio-main">
  <!-- Populated by JS — content swaps between signed-in profile / not-signed-in CTA -->
</main>

<script>
const NI_USER_KEY = 'ni_user';
const NI_PORTFOLIO_KEY = 'ni_portfolio';

function niGetUser() { try { return JSON.parse(localStorage.getItem(NI_USER_KEY) || 'null'); } catch (_) { return null; } }
function niGetPortfolio() { try { return JSON.parse(localStorage.getItem(NI_PORTFOLIO_KEY) || '[]'); } catch (_) { return []; } }
function niSetPortfolio(arr) { localStorage.setItem(NI_PORTFOLIO_KEY, JSON.stringify(arr)); }
function niInitials(n) {
  if (!n) return '?';
  return n.trim().split(/\s+/).slice(0,2).map(s => s[0]?.toUpperCase() || '').join('') || '?';
}
const CCY_LOCALE = { DKK:'da-DK', SEK:'sv-SE', NOK:'nb-NO', EUR:'de-DE', GBP:'en-GB', USD:'en-US', CHF:'de-CH' };
function fmtCurrency(n, c) {
  const sym = { DKK:'kr', SEK:'kr', NOK:'kr', EUR:'€', GBP:'£', USD:'$', CHF:'Fr' }[c] || c;
  if (n == null || isNaN(n)) return '—';
  const num = Math.round(n).toLocaleString(CCY_LOCALE[c] || 'da-DK');
  return (c === 'DKK' || c === 'SEK' || c === 'NOK') ? (num + ' ' + sym) : (sym + num);
}
function L(da, en) { return (window.getLang && window.getLang() === 'en') ? en : da; }
const ICON_EYE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
const ICON_SHEET = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h8M8 9h1"/></svg>';
const ICON_PENCIL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>';
const ICON_TRASH = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6"/></svg>';
function scoreColor(s) {
  if (s == null) return '';
  return s >= 65 ? 'green' : s >= 40 ? 'amber' : 'red';
}
function t(k, v) { return (window.t ? window.t(k, v) : k); }
function fmtDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });
}

function render() {
  const main = document.getElementById('portfolio-main');
  const user = niGetUser();

  if (!user) {
    main.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="7" r="4"/><path d="M5 21v-2a4 4 0 014-4h6a4 4 0 014 4v2"/></svg>
        </div>
        <div class="empty-title">${t('portfolio.notSignedIn')}</div>
        <div class="empty-desc">${t('portfolio.notSignedInDesc')}</div>
        <a href="/#analyze-section" class="empty-cta">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
          ${t('portfolio.notSignedInCta')}
        </a>
      </div>`;
    return;
  }

  const portfolio = niGetPortfolio();
  const total = portfolio.length;
  const scores = portfolio.map(p => p.score).filter(s => typeof s === 'number');
  const avgScore = scores.length ? Math.round(scores.reduce((a,b) => a+b, 0) / scores.length) : null;
  const countries = new Set(portfolio.map(p => (p.location || '').split(',').pop()?.trim()).filter(Boolean));
  const totalCashflow = portfolio.reduce((sum, p) => sum + (p.monthlyCashFlow || 0), 0);
  const primaryCurrency = portfolio[0]?.currency || 'EUR';

  const propertiesHtml = portfolio.length === 0
    ? `
      <div class="empty-state">
        <div class="empty-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2z"/></svg>
        </div>
        <div class="empty-title">${t('portfolio.empty')}</div>
        <div class="empty-desc">${t('portfolio.emptyDesc')}</div>
        <a href="/#analyze-section" class="empty-cta">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
          ${t('portfolio.emptyCta')}
        </a>
      </div>`
    : `
      <div class="property-grid">
        ${portfolio.map(p => `
          <article class="property-card" data-card="${p.id}">
            <div class="pc-clickable" data-open="${p.id}">
              <div class="pc-top">
                <div style="flex:1;min-width:0;">
                  <div class="pc-title" data-title="${p.id}">${escapeHtml(p.title || p.location)}</div>
                  ${p.title ? `<div class="pc-title-sub">${escapeHtml(p.location)}</div>` : ''}
                </div>
                ${p.score != null ? `<div class="pc-score ${scoreColor(p.score)}">${p.score}</div>` : ''}
              </div>
              ${p.classification && p.classification !== '—' ? `<div class="pc-classification" style="margin-top:12px;"><span class="pc-dot"></span>${escapeHtml(p.classification)}</div>` : ''}
              <div class="pc-metrics">
                <div class="pc-metric"><div class="pc-metric-label">${L('Pris','Price')}</div><div class="pc-metric-value">${fmtCurrency(p.price, p.currency)}</div></div>
                <div class="pc-metric"><div class="pc-metric-label">${L('Leje / md','Rent / mo')}</div><div class="pc-metric-value">${fmtCurrency(p.rent, p.currency)}</div></div>
                <div class="pc-metric"><div class="pc-metric-label">${L('Afkast','Yield')}</div><div class="pc-metric-value">${p.rentalYield != null ? p.rentalYield.toFixed(2) + '%' : '—'}</div></div>
                <div class="pc-metric"><div class="pc-metric-label">Cash flow</div><div class="pc-metric-value ${p.monthlyCashFlow >= 0 ? 'positive' : 'negative'}">${p.monthlyCashFlow != null ? (p.monthlyCashFlow >= 0 ? '+' : '−') + fmtCurrency(Math.abs(p.monthlyCashFlow), p.currency) : '—'}</div></div>
              </div>
              <div class="pc-open-hint">${ICON_EYE}${L('Åbn fuld analyse','Open full analysis')} →</div>
            </div>
            <div class="pc-actions">
              <button type="button" class="pcbtn primary" data-export="${p.id}">${ICON_SHEET}<span>${L('Eksportér','Export')}</span></button>
              <button type="button" class="pcbtn label-hide" data-rename="${p.id}">${ICON_PENCIL}<span>${L('Omdøb','Rename')}</span></button>
              <button type="button" class="pcbtn danger" data-remove="${p.id}" aria-label="${L('Fjern','Remove')}" title="${L('Fjern','Remove')}">${ICON_TRASH}</button>
            </div>
          </article>
        `).join('')}
      </div>`;

  main.innerHTML = `
    <section class="profile-hero">
      <div class="profile-hero-inner">
        <div class="avatar-xl">${niInitials(user.name)}</div>
        <div>
          <div class="profile-info-name">${escapeHtml(user.name)}</div>
          <div class="profile-info-meta">
            <span>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><path d="M22 6l-10 7L2 6"/></svg>
              ${escapeHtml(user.email)}
            </span>
            <span>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>
              ${escapeHtml(user.country)}
            </span>
          </div>
        </div>
        <div class="profile-actions">
          <a href="/#analyze-section" class="profile-btn-primary">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
            Analyze
          </a>
          <button type="button" class="profile-btn-ghost" id="logout-btn">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>
            ${t('portfolio.logout')}
          </button>
        </div>
      </div>
    </section>

    <section class="stats-strip">
      <div class="stat-card">
        <div class="stat-label">${t('portfolio.statsTotal')}</div>
        <div class="stat-value">${total}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">${t('portfolio.statsAvgScore')}</div>
        <div class="stat-value">${avgScore != null ? avgScore : '—'}<span style="font-size:14px; color: var(--text-muted); margin-left: 4px;">/100</span></div>
      </div>
      <div class="stat-card">
        <div class="stat-label">${t('portfolio.statsCountries')}</div>
        <div class="stat-value">${countries.size}</div>
        <div class="stat-sub">${Array.from(countries).slice(0,3).join(' · ') || '—'}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">${t('portfolio.statsTotalCashflow')}</div>
        <div class="stat-value ${totalCashflow >= 0 ? 'positive' : 'negative'}">${totalCashflow >= 0 ? '+' : '−'}${fmtCurrency(Math.abs(totalCashflow), primaryCurrency)}</div>
      </div>
    </section>

    <div class="section-header">
      <div class="section-title">${L('Gemte boliger','Saved properties')}${total > 0 ? ` <span class="section-count">(${total})</span>` : ''}</div>
      ${total > 0 ? `<button type="button" class="btn-export-all" id="export-all-btn">${ICON_SHEET}${L('Eksportér alle til Sheets','Export all to Sheets')}</button>` : ''}
    </div>
    ${propertiesHtml}
  `;

  // Wire up logout
  document.getElementById('logout-btn')?.addEventListener('click', () => {
    localStorage.removeItem(NI_USER_KEY);
    render();
  });
  // Open the full analyser on card body click — re-runs the complete analysis
  main.querySelectorAll('[data-open]').forEach(el => {
    el.addEventListener('click', () => openInAnalyser(el.getAttribute('data-open')));
  });
  // Per-property export
  main.querySelectorAll('[data-export]').forEach(btn => {
    btn.addEventListener('click', (e) => { e.stopPropagation(); exportProperty(btn.getAttribute('data-export')); });
  });
  // Rename
  main.querySelectorAll('[data-rename]').forEach(btn => {
    btn.addEventListener('click', (e) => { e.stopPropagation(); startRename(btn.getAttribute('data-rename')); });
  });
  // Remove
  main.querySelectorAll('[data-remove]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (!confirm(L('Fjern denne bolig fra din profil?', 'Remove this property from your profile?'))) return;
      niSetPortfolio(niGetPortfolio().filter(p => p.id !== btn.getAttribute('data-remove')));
      render();
    });
  });
  // Export all
  document.getElementById('export-all-btn')?.addEventListener('click', exportAll);
}

// ═══════════ OPEN IN FULL ANALYSER ═══════════
// Hand the saved property to the homepage analyser, which re-runs the complete
// analysis (score, KPIs, BRRRR / Renovation, projection, stress test) on load.
function openInAnalyser(id) {
  const p = niGetPortfolio().find(x => x.id === id);
  if (!p) return;
  try {
    localStorage.setItem('ni_open_analysis', JSON.stringify({
      location: p.location, price: p.price, rent: p.rent, down: p.down,
      rate: p.rate, expenses: p.expenses, currency: p.currency, strategy: p.strategy || 'cashflow'
    }));
  } catch (_) {}
  window.location.href = '/';
}

// ═══════════ RENAME (inline) ═══════════
function startRename(id) {
  const p = niGetPortfolio().find(x => x.id === id);
  const titleEl = document.querySelector('.pc-title[data-title="' + id + '"]');
  if (!p || !titleEl) return;
  const input = document.createElement('input');
  input.className = 'pc-rename-input';
  input.value = p.title || p.location || '';
  input.maxLength = 80;
  titleEl.replaceWith(input);
  input.focus(); input.select();
  let done = false;
  const commit = (save) => {
    if (done) return; done = true;
    if (save) {
      const v = input.value.trim();
      const arr = niGetPortfolio();
      const it = arr.find(x => x.id === id);
      if (it) { if (v && v !== it.location) it.title = v; else delete it.title; niSetPortfolio(arr); }
    }
    render();
  };
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); commit(true); }
    else if (e.key === 'Escape') { e.preventDefault(); commit(false); }
  });
  input.addEventListener('blur', () => commit(true));
}

// ═══════════ DETAIL MODAL ═══════════
function ensureModal() {
  let bd = document.getElementById('pd-backdrop');
  if (bd) return bd;
  bd = document.createElement('div');
  bd.className = 'pd-backdrop'; bd.id = 'pd-backdrop';
  bd.innerHTML = '<div class="pd-modal" id="pd-modal" role="dialog" aria-modal="true"></div>';
  document.body.appendChild(bd);
  bd.addEventListener('click', (e) => { if (e.target === bd) closeDetail(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeDetail(); });
  return bd;
}
function closeDetail() { document.getElementById('pd-backdrop')?.classList.remove('open'); }
function openDetail(id) {
  const p = niGetPortfolio().find(x => x.id === id);
  if (!p) return;
  const bd = ensureModal();
  const modal = document.getElementById('pd-modal');
  const sc = scoreColor(p.score);
  const cf = p.monthlyCashFlow;
  const row = (l, v, cls) => `<div class="pd-row"><div class="l">${l}</div><div class="v ${cls || ''}">${v}</div></div>`;
  modal.innerHTML = `
    <div class="pd-head">
      <div style="min-width:0;">
        <h3>${escapeHtml(p.title || p.location)}</h3>
        ${p.title ? `<div class="pd-loc">${escapeHtml(p.location)}</div>` : `<div class="pd-loc">${L('Gemt','Saved')} ${fmtDate(p.savedAt)}</div>`}
      </div>
      <button type="button" class="pd-close" aria-label="Luk" onclick="closeDetail()">×</button>
    </div>
    <div class="pd-body">
      <div class="pd-scorewrap">
        ${p.score != null ? `<div class="pd-score ${sc}"><b>${p.score}</b><span>/100</span></div>` : ''}
        <div class="pd-verdict">
          <div class="cls">${escapeHtml(p.classification && p.classification !== '—' ? p.classification : L('Analyseret bolig','Analyzed property'))}</div>
          <div class="dt">${L('Gemt','Saved')} ${fmtDate(p.savedAt)}</div>
        </div>
      </div>
      <div class="pd-group-title">${L('Nøgletal','Key metrics')}</div>
      <div class="pd-rows">
        ${row(L('Bruttoafkast','Gross yield'), p.rentalYield != null ? p.rentalYield.toFixed(2) + '%' : '—')}
        ${row('Cash flow / md', cf != null ? (cf >= 0 ? '+' : '−') + fmtCurrency(Math.abs(cf), p.currency) : '—', cf >= 0 ? 'pos' : 'neg')}
        ${row('ROI', p.roi != null ? p.roi.toFixed(2) + '%' : '—')}
        ${row(L('Score','Score'), p.score != null ? p.score + '/100' : '—')}
      </div>
      <div class="pd-group-title">${L('Ejendommen','The property')}</div>
      <div class="pd-rows">
        ${row(L('Pris','Price'), fmtCurrency(p.price, p.currency))}
        ${row(L('Månedlig leje','Monthly rent'), fmtCurrency(p.rent, p.currency))}
        ${row(L('Udbetaling','Down payment'), p.down != null ? p.down + '%' : '—')}
        ${row(L('Rente','Interest rate'), p.rate != null ? p.rate + '%' : '—')}
        ${row(L('Månedlige udgifter','Monthly expenses'), fmtCurrency(p.expenses, p.currency))}
        ${row(L('Valuta','Currency'), p.currency || '—')}
      </div>
      <div class="pd-actions">
        <button type="button" class="primary" data-pd-export="${p.id}">${ICON_SHEET}${L('Eksportér til Sheets','Export to Sheets')}</button>
        <button type="button" data-pd-rename="${p.id}">${ICON_PENCIL}${L('Omdøb','Rename')}</button>
      </div>
    </div>`;
  modal.querySelector('[data-pd-export]').addEventListener('click', () => exportProperty(p.id));
  modal.querySelector('[data-pd-rename]').addEventListener('click', () => { closeDetail(); startRename(p.id); });
  bd.classList.add('open');
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ═══════════ EXPORT TO SHEETS (multi-tab .xlsx — opens in Google Sheets, Excel, Numbers) ═══════════
function propertyRows(p) {
  const cur = p.currency || '';
  const money = (n) => (n == null || isNaN(n)) ? '' : Math.round(n);
  return [
    ['NordInvest — ' + L('Ejendomsanalyse','Property analysis')],
    [L('Titel','Title'), p.title || p.location || ''],
    [L('Placering','Location'), p.location || ''],
    [L('Gemt','Saved'), fmtDate(p.savedAt)],
    [],
    [L('NØGLETAL','KEY METRICS')],
    [L('Investeringsscore','Investment score'), p.score == null ? '' : p.score],
    [L('Bruttoafkast (%)','Gross yield (%)'), p.rentalYield == null ? '' : Number(p.rentalYield.toFixed(2))],
    [L('Månedlig cash flow','Monthly cash flow') + (cur ? ' (' + cur + ')' : ''), money(p.monthlyCashFlow)],
    ['ROI (%)', p.roi == null ? '' : Number(p.roi.toFixed(2))],
    [L('Klassificering','Classification'), p.classification || ''],
    [],
    [L('EJENDOM','PROPERTY')],
    [L('Pris','Price') + (cur ? ' (' + cur + ')' : ''), money(p.price)],
    [L('Månedlig leje','Monthly rent') + (cur ? ' (' + cur + ')' : ''), money(p.rent)],
    [L('Udbetaling (%)','Down payment (%)'), p.down == null ? '' : p.down],
    [L('Rente (%)','Interest rate (%)'), p.rate == null ? '' : p.rate],
    [L('Månedlige udgifter','Monthly expenses') + (cur ? ' (' + cur + ')' : ''), money(p.expenses)],
    [L('Valuta','Currency'), cur],
  ];
}
function overviewRows(list) {
  const head = [L('Titel','Title'), L('Placering','Location'), 'Score', L('Afkast %','Yield %'), 'Cash flow', 'ROI %', L('Pris','Price'), L('Leje','Rent'), L('Valuta','Currency'), L('Gemt','Saved')];
  const rows = [['NordInvest — ' + L('Porteføljeoversigt','Portfolio overview')], [], head];
  list.forEach(p => rows.push([
    p.title || p.location || '', p.location || '', p.score == null ? '' : p.score,
    p.rentalYield == null ? '' : Number(p.rentalYield.toFixed(2)),
    p.monthlyCashFlow == null ? '' : Math.round(p.monthlyCashFlow),
    p.roi == null ? '' : Number(p.roi.toFixed(2)),
    p.price == null ? '' : Math.round(p.price), p.rent == null ? '' : Math.round(p.rent),
    p.currency || '', fmtDate(p.savedAt)
  ]));
  return rows;
}
function sheetNameFor(str, used) {
  let n = String(str || 'Bolig').replace(/[\[\]\:\*\?\/\\]/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 28) || 'Bolig';
  const base = n; let i = 2;
  while (used.has(n.toLowerCase())) { n = (base.slice(0, 25) + ' ' + i); i++; }
  used.add(n.toLowerCase());
  return n;
}
function slug(s) { return String(s || 'bolig').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40) || 'bolig'; }
function exportProperty(id) {
  const p = niGetPortfolio().find(x => x.id === id);
  if (!p) return;
  const bytes = buildXlsx([{ name: sheetNameFor(p.title || p.location, new Set()), rows: propertyRows(p) }]);
  downloadXlsx(bytes, 'nordinvest-' + slug(p.title || p.location) + '.xlsx');
}
function exportAll() {
  const list = niGetPortfolio();
  if (!list.length) return;
  const used = new Set();
  const sheets = [{ name: sheetNameFor(L('Oversigt','Overview'), used), rows: overviewRows(list) }];
  list.forEach(p => sheets.push({ name: sheetNameFor(p.title || p.location, used), rows: propertyRows(p) }));
  downloadXlsx(buildXlsx(sheets), 'nordinvest-portefolje.xlsx');
}
function downloadXlsx(bytes, filename) {
  const blob = new Blob([bytes], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 3000);
}
function xmlEsc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function colLetter(i) { let s = ''; i++; while (i > 0) { const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); } return s; }
function sheetXml(rows) {
  let body = '';
  rows.forEach((row, r) => {
    let cells = '';
    (row || []).forEach((val, c) => {
      if (val === '' || val == null) return;
      const ref = colLetter(c) + (r + 1);
      if (typeof val === 'number' && isFinite(val)) cells += '<c r="' + ref + '"><v>' + val + '</v></c>';
      else cells += '<c r="' + ref + '" t="inlineStr"><is><t xml:space="preserve">' + xmlEsc(val) + '</t></is></c>';
    });
